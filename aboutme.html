<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="aboutme.css">
</head>

<body>
  <div class="container mt-5">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded">
      <div class="container-fluid">
        <a class="navbar-brand" href="mainmenu.html">JWT SPA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="accounts.html">Accounts</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="domains.html">Domains</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="aboutme.html">About Me</a>
            </li>
          </ul>
          <div class="d-flex gap-2">
            <button id="refresh-domains-btn" class="btn btn-outline-info">Refresh About Me</button>
            <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
          </div>
        </div>
      </div>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>About Me</h1>
    </div>

    <div id="profile-section" class="card">
      <div class="card-body">
        <h5 class="card-title">Profile Information</h5>
        <div id="profile-error" class="alert alert-danger d-none"></div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item"><strong>ID:</strong> <span id="profile-id"></span></li>
          <li class="list-group-item"><strong>Username:</strong> <span id="profile-username"></span></li>
          <li class="list-group-item"><strong>Email:</strong> <span id="profile-email"></span></li>
        </ul>
      </div>
    </div>

    <div id="jwt-section" class="card mt-4 jwt-section">
      <div class="card-body">
        <h5 class="card-title">Your Authentication Token (JWT)</h5>
        <div class="mt-3">
          <pre id="jwt-display" class="bg-light p-3 rounded border text-break jwt-display"></pre>
          <button id="copy-jwt-btn" class="btn btn-outline-primary mt-2">Copy to Clipboard</button>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="aboutme.js"></script>
</body>
</html>
