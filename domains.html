<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded">
          <div class="container-fluid">
            <a class="navbar-brand" href="mainmenu.html">JWT SPA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                  <a class="nav-link" href="accounts.html">Accounts</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="domains.html">Domains</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="aboutme.html">About Me</a>
                </li>
              </ul>
              <div class="d-flex gap-2">
                <button id="refresh-domains-btn" class="btn btn-outline-info">Refresh Domains</button>
                <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
              </div>
            </div>
          </div>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Domain Management</h1>
        </div>

        <!-- Form for Adding and Editing Domains -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title" id="form-title">Add Domain</h5>
                <form id="domain-form">
                    <input type="hidden" id="domain-id">
                    <div class="row">
                        <div class="col-md-5 mb-3">
                            <label for="domain" class="form-label">Domain</label>
                            <input type="text" class="form-control" id="domain" placeholder="e.g., example" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="tld" class="form-label">TLD</label>
                            <input type="text" class="form-control" id="tld" placeholder="e.g., com" required>
                        </div>
                        <div class="col-md-2 d-flex align-items-end mb-3">
                            <button type="submit" class="btn btn-primary w-100">Save</button>
                        </div>
                    </div>
                     <button type="button" class="btn btn-light mt-2" id="cancel-btn" style="display: none;">Cancel Edit</button>
                </form>
            </div>
        </div>

        <!-- Table to Display Domains -->
        <div class="card">
             <div class="card-body">
                <h5 class="card-title">Registered Domains</h5>
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Domain</th>
                            <th>Domain</th>
                            <th>TLD</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="domains-table-body">
                        <!-- Domain rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="domains.js"></script>
</body>
</html>
